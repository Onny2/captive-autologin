name: Release
# Push a tag like v0.1.0 to build and publish the .deb, .dmg and .exe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - run: sh packaging/build_deb.sh
      - name: Smoke-test the package
        run: |
          sudo apt-get install -y ./dist/*.deb
          captive-autologin --version
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: dist/*.deb }

  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
          - os: macos-15-intel    # Intel
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: sh packaging/build_dmg.sh
      - name: Smoke-test the binary
        run: ./dist/captive-autologin --version
      - uses: actions/upload-artifact@v4
        with: { name: "dmg-${{ matrix.os }}", path: dist/*.dmg }

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --clean --noconfirm --name captive-autologin packaging/entry.py
      - name: Smoke-test the binary
        run: .\dist\captive-autologin.exe --version
      - run: Rename-Item dist\captive-autologin.exe captive-autologin-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: dist/*.exe }

  publish:
    needs: [deb, dmg, exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: cd artifacts && sha256sum * > SHA256SUMS && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
